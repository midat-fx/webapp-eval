name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifiers:
    # Builds the grading image and checks every hidden verifier against its
    # reference fix, an alternative fix, the untouched start state and the
    # known-bad patches. No agent runs and no API keys here.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo "kezek_sha=$(cat base/kezek.sha)" >> "$GITHUB_OUTPUT"
        id: pin
      # The image is ~2.5 GB and almost never changes; its layers live in the
      # Actions cache, so only a changed layer (verify/lib, grade.sh) rebuilds.
      - uses: docker/setup-buildx-action@v3
      - name: Build grading image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: KEZEK_SHA=${{ steps.pin.outputs.kezek_sha }}
          tags: webapp-eval-runner:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # `make test` minus `image`, which the step above already did.
      - run: make unit check-verifiers JOBS=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck
          path: .cache/selfcheck
